<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wheel of Names</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232563eb'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="won-header">
    <div class="won-brand" id="brand-logo" title="Wheel of Names">
      <div class="won-logo-circle"></div>
      <span class="won-brand-name">Wheel of Names</span>
    </div>

    <nav class="won-header-menu">
      <button id="btn-nav-customize" class="won-menu-btn">
        <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.28 19.64 10.59 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <span>Customize</span>
      </button>

      <button id="btn-nav-new" class="won-menu-btn">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        <span>New</span>
      </button>

      <button class="won-menu-btn">
        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        <span>Open</span>
      </button>

      <button class="won-menu-btn">
        <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zm-7-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        <span>Save</span>
      </button>

      <button class="won-menu-btn">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
        <span>Share</span>
      </button>

      <button class="won-menu-btn">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>Gallery</span>
      </button>

      <button id="btn-fullscreen" class="won-menu-btn" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>

      <button class="won-menu-btn">
        <span>More ▾</span>
      </button>

      <button class="won-menu-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <span>English</span>
      </button>
    </nav>

    <!-- Hamburger button shown when width is compressed (matching Left Online screenshot) -->
    <button class="won-hamburger-btn" id="btn-hamburger" title="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
  </header>

  <!-- Main View Container -->
  <main class="won-main-layout">

    <!-- Left Google Ad Column (100% convincing like the screenshot) -->
    <aside class="won-left-ad-column">
      <div class="ad-report-links">
        <span>Report bad ad 🏳</span>
        <span>Close ads ⓧ</span>
      </div>
      <div class="ad-card-banner">
        <div class="ad-meta-top">
          <span style="font-weight:700;">Google Ads</span>
          <span>ⓘ ×</span>
        </div>
        <div class="ad-main-heading">
          Turn searches into sales this <span class="season-text">season</span>
        </div>
        <div class="ad-sub-pill">
          <span>🎁</span>
          <span>gifts for runners</span>
        </div>
        <div style="font-size:0.75rem; color:#9ca3af; line-height:1.4;">
          Reach customers right when they are searching for what you offer.
        </div>
        <button class="ad-action-btn">Learn more</button>
      </div>
    </aside>

    <!-- Center Wheel Area -->
    <section class="won-wheel-area">
      <button class="won-wheel-edit-btn" title="Customize">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>

      <!-- Wheel Box -->
      <div class="won-wheel-box">
        <!-- Wheel Canvas -->
        <canvas id="wheel-canvas" width="800" height="800"></canvas>

        <!-- Right 3D Gold Pointer (3 o'clock position) matching Image 2 -->
        <div id="wheel-pointer" class="won-right-pointer">
          <svg viewBox="0 0 36 44" width="36" height="44">
            <defs>
              <filter id="pointerShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
              </filter>
            </defs>
            <!-- Top facet (Bright Gold) -->
            <polygon points="2,22 34,4 34,22" fill="#fde047" stroke="#ca8a04" stroke-width="0.8" filter="url(#pointerShadow)"/>
            <!-- Bottom facet (Darker Gold Shadow) -->
            <polygon points="2,22 34,22 34,40" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
            <!-- Center crease highlight -->
            <line x1="2" y1="22" x2="34" y2="22" stroke="#fef08a" stroke-width="1"/>
          </svg>
        </div>

        <!-- Center Hub -->
        <div id="center-hub" class="won-wheel-hub"></div>
      </div>
    </section>

    <!-- Right Sidebar (Entries & Results) -->
    <aside class="won-right-sidebar" id="won-right-sidebar">
      <button class="won-collapse-btn" id="btn-toggle-sidebar">❯</button>

      <!-- Tab Row -->
      <div class="won-sidebar-tab-row">
        <button class="won-tab-item active" id="tab-btn-entries">
          <span>Entries</span>
          <span class="won-tab-pill" id="entries-count-badge">14</span>
        </button>
        <button class="won-tab-item" id="tab-btn-results">
          <span>Results</span>
          <span class="won-tab-pill" id="results-count-badge">0</span>
        </button>
      </div>

      <!-- Tab 1: Entries -->
      <div id="entries-panel" class="won-textarea-box">
        <div class="won-toolbar-actions">
          <button class="won-action-pill-btn" id="btn-tool-shuffle">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            <span>Shuffle</span>
          </button>
          <button class="won-action-pill-btn" id="btn-tool-sort">
            <svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
            <span>Sort</span>
          </button>
          <button class="won-action-pill-btn">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            <span>Add image ▾</span>
          </button>
          <label class="won-advanced-label">
            <input type="checkbox" id="chk-advanced">
            <span>Advanced</span>
          </label>
        </div>

        <!-- Names List Textarea -->
        <textarea id="entries-textarea" class="won-entries-input" spellcheck="false"></textarea>
      </div>

      <!-- Tab 2: Results -->
      <div id="results-panel" class="won-results-box">
        <div id="results-list"></div>
      </div>

      <!-- Footer -->
      <div class="won-sidebar-bottom">
        <button class="won-btn-add-wheel">
          <span>+ Add wheel</span>
          <span>▾</span>
        </button>
        <div class="won-version-row">
          <span>Version 432 <span class="won-pill-new">New!</span></span>
          <span style="cursor:pointer;">Changelog</span>
        </div>
      </div>
    </aside>

  </main>

  <!-- Official Winner Modal (Zero mention of prize!) -->
  <div id="winner-modal" class="won-winner-overlay">
    <div class="won-winner-dialog">
      <div class="won-dialog-head">
        <span class="won-dialog-title">We have a winner!</span>
        <button class="won-dialog-close-x" id="btn-modal-x">&times;</button>
      </div>

      <!-- Only the Winner's Name is shown! -->
      <div id="winner-display-name" class="won-winner-big-name">shushi ya</div>

      <div class="won-dialog-foot">
        <button id="btn-modal-close" class="won-btn-dialog-close">Close</button>
        <button id="btn-modal-remove" class="won-btn-dialog-remove">Remove</button>
      </div>
    </div>
  </div>

  <!-- Innocent "Customize" Modal (Dispels any suspicion if an employee clicks it) -->
  <div id="customize-modal" class="won-customize-modal">
    <div class="won-customize-dialog">
      <div class="customize-nav-tabs">
        <button class="customize-tab active">During spin</button>
        <button class="customize-tab">After spin</button>
        <button class="customize-tab">Appearance</button>
      </div>
      <div class="customize-body">
        <div class="customize-option-row">
          <span>Spin sound</span>
          <select>
            <option>Tick ticking sound</option>
            <option>Bell</option>
            <option>Music</option>
          </select>
        </div>
        <div class="customize-option-row">
          <span>Spin time (seconds)</span>
          <input type="range" min="3" max="20" value="10">
        </div>
        <div class="customize-option-row">
          <span>Allow duplicate winning</span>
          <input type="checkbox" checked>
        </div>
        <div style="display:flex; justify-content:flex-end; margin-top:10px;">
          <button id="btn-close-customize" class="won-btn-dialog-close">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="confetti.js"></script>
  <script src="app.js"></script>
</body>
</html>
